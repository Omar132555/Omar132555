<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#00d9ff"/>
    </linearGradient>
    <style>
      .name{font:700 62px 'Segoe UI',Arial,sans-serif;fill:url(#name)}
      .sub{font:500 21px 'Segoe UI',Arial,sans-serif;fill:#cfe8f0;letter-spacing:1px}
      .line{font:600 20px 'Consolas','Courier New',monospace;fill:#00d9ff;opacity:0}
      .l1{animation:cycle 12s infinite 0s}
      .l2{animation:cycle 12s infinite 3s}
      .l3{animation:cycle 12s infinite 6s}
      .l4{animation:cycle 12s infinite 9s}
      @keyframes cycle{0%{opacity:0}5%{opacity:1}22%{opacity:1}27%{opacity:0}100%{opacity:0}}
      .dot{animation:float 6s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
      .cursor{animation:blink 1s step-end infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1000" height="260" fill="url(#bg)"/>
  <g opacity="0.15" fill="#00d9ff">
    <circle class="dot" cx="90" cy="60" r="40"/>
    <circle class="dot" cx="930" cy="200" r="55" style="animation-delay:-2s"/>
    <circle class="dot" cx="820" cy="45" r="22" style="animation-delay:-4s"/>
    <circle class="dot" cx="170" cy="215" r="18" style="animation-delay:-1s"/>
  </g>
  <text x="500" y="105" text-anchor="middle" class="name">Omar Mostafa</text>
  <text x="500" y="145" text-anchor="middle" class="sub">SOFTWARE ENGINEER  •  FULL STACK &amp; BACKEND</text>
  <g text-anchor="middle">
    <text x="500" y="200" class="line l1">&gt; I build APIs that scale<tspan class="cursor">_</tspan></text>
    <text x="500" y="200" class="line l2">&gt; Laravel • Spring Boot • React • Angular<tspan class="cursor">_</tspan></text>
    <text x="500" y="200" class="line l3">&gt; I put LLMs inside real products<tspan class="cursor">_</tspan></text>
    <text x="500" y="200" class="line l4">&gt; Cairo, Egypt<tspan class="cursor">_</tspan></text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
